[project]
name = "chaski-common"
version = "0.1.0"
description = "Shared building blocks for CHASKI services: settings, auth, roles, audit, masking, logging."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.3.6",
  "structlog>=24.4",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "azure-identity>=1.19",
  "azure-eventhub>=5.12",
  "azure-monitor-opentelemetry>=1.6",
  "opentelemetry-instrumentation-httpx>=0.48b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chaski_common"]
