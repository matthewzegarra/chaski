# Removes Microsoft Sentinel from log-chaski before its 31-day free trial ends, so it never
# starts billing (FinOps). main.bicep stops onboarding it after the same date
# (param sentinelTrialEnds), so later infra deploys do not bring it back.
# Analytics rules and incidents are removed with it; the workspace and its logs stay.
name: Sentinel offboard

on:
  schedule:
    - cron: "0 12 31 10 *"   # 31 Oct, 07:00 Lima (trial started 3 Oct 2026)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offboard:
    name: Remove Sentinel from the workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: infra
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Azure login (OIDC, IaC identity)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Delete the Sentinel onboarding state
        env:
          SUB: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RG: ${{ vars.RESOURCE_GROUP }}
        run: |
          url="https://management.azure.com/subscriptions/${SUB}/resourceGroups/${RG}/providers/Microsoft.OperationalInsights/workspaces/log-chaski/providers/Microsoft.SecurityInsights/onboardingStates/default?api-version=2024-03-01"
          if az rest --method get --url "$url" -o none 2>/dev/null; then
            az rest --method delete --url "$url" -o none
            echo "### 🧹 Sentinel retirado de log-chaski (fin de la prueba gratuita)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Sentinel ya no estaba habilitado" >> "$GITHUB_STEP_SUMMARY"
          fi
