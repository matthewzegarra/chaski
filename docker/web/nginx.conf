# SPA server for the CHASKI web apps. Security headers live in /tmp/chaski-headers.conf,
# generated at start by 40-chaski-env.sh (the CSP must list the API origins).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    include /tmp/chaski-headers.conf;

    # Runtime config and service worker must never be cached.
    location = /env.js {
        include /tmp/chaski-headers.conf;
        add_header Cache-Control "no-store" always;
    }
    location = /sw.js {
        include /tmp/chaski-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location /assets/ {
        include /tmp/chaski-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location / {
        try_files $uri /index.html;
    }
}
