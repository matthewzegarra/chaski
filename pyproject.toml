# Virtual uv workspace root. Each member has its own pyproject.toml.
[tool.uv.workspace]
members = [
  "libs/chaski_common",
  "services/cuentas-api",
  "services/core-api",
  "services/ia-api",
  "simulator",
]

[tool.uv.sources]
chaski-common = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-python-dateutil",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "S101",   # assert is fine in tests
  "B008",   # FastAPI Depends() in defaults
  "S311",   # random is fine for the simulator
  "RUF001", "RUF002", "RUF003",  # Spanish text uses accents/ñ
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]
"simulator/src/chaski_simulator/catalog.py" = ["E501"]  # Spanish sample texts

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["libs", "services", "simulator"]
