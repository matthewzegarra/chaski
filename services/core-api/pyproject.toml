[project]
name = "core-api"
version = "0.1.0"
description = "Clientes, onboarding, tarjetas, préstamos, quejas, fraude, consola y analítica."
requires-python = ">=3.12"
dependencies = [
  "chaski-common",
  "uvicorn[standard]>=0.54.0",
  "pyodbc>=5.4.0",  # Azure SQL (ANALYTICS_DIALECT=tsql)
  "python-multipart>=0.0.12",
  "email-validator>=2.2",
  "azure-storage-blob>=12.23",
  "azure-keyvault-secrets>=4.9",
  "pyarrow>=18",
]

[tool.uv.sources]
chaski-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core_api"]
